controller:
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  serviceType: ClusterIP

  admin:
    username: admin
    password: admin123

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - docker-workflow:latest

  # ext4 볼륨에서 fsGroup이 동작하지 않는 이슈 우회
  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "Always"
    supplementalGroups: [1000]

persistence:
  enabled: true
  size: 8Gi
  storageClass: cinder-default
